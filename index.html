<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초4 영단어 마스터 (100단어)</title>
    <style>
        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            background-color: #f0f8ff; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; 
        }
        
        h2 { color: #333; margin-bottom: 5px; }
        .progress { color: #666; font-size: 1.1rem; margin-bottom: 15px; font-weight: bold; }

        /* 단어 카드 스타일 */
        .card-container { 
            width: 85%; max-width: 450px; height: 350px; 
            perspective: 1000px; margin-bottom: 25px; cursor: pointer; 
        }
        .card { 
            width: 100%; height: 100%; position: relative; 
            transition: transform 0.6s; transform-style: preserve-3d; 
        }
        .card.is-flipped { transform: rotateY(180deg); }
        
        .card-face { 
            position: absolute; width: 100%; height: 100%; 
            backface-visibility: hidden; border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            text-align: center; padding: 20px; box-sizing: border-box; 
        }
        
        .card-front { background-color: #ffffff; }
        .card-back { background-color: #ffe4e1; transform: rotateY(180deg); }
        
        .word-img {
            width: 80%; height: 120px;
            border-radius: 15px; margin-bottom: 15px;
            object-fit: cover; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .word { font-size: 3.5rem; font-weight: bold; margin-bottom: 5px; color: #ff6b6b; }
        .meaning { font-size: 3rem; font-weight: bold; margin-bottom: 15px; color: #4ecdc4; }
        .example { font-size: 1.3rem; color: #555; word-break: keep-all; line-height: 1.4; }
        
        .controls { display: flex; gap: 15px; margin-bottom: 15px; }
        .master-controls { display: flex; gap: 15px; }
        
        button { 
            padding: 15px 25px; font-size: 1.2rem; border: none; border-radius: 15px; 
            color: white; cursor: pointer; font-weight: bold; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s;
        }
        button:active { transform: translateY(2px); box-shadow: none; }
        
        .btn-nav { background-color: #a5b1c2; }
        .btn-know { background-color: #20bf6b; width: 240px; font-size: 1.1rem;}
        
        .audio-btn { 
            margin-top: 10px; padding: 10px 20px; 
            background-color: #ff9f43; font-size: 1.1rem; border-radius: 20px; 
        }
        
        #success-message {
            display: none; flex-direction: column; align-items: center; text-align: center;
        }
        #success-message h1 { color: #ff6b6b; font-size: 3rem; margin-bottom: 10px; }
        .btn-restart { background-color: #4ecdc4; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="app-container" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        <h2>도전! 영단어 100개 마스터 🚀</h2>
        <div class="progress" id="progress-text">남은 단어: 100개</div>
        
        <div class="card-container" id="flashcard">
            <div class="card" id="card-inner">
                <div class="card-face card-front">
                    <img id="word-image" class="word-img" src="" alt="word image">
                    <div class="word" id="en-word">Loading...</div>
                    <button class="audio-btn" id="audio-btn" onclick="playAudio(event)">🔊 원어민 발음</button>
                    <p style="font-size: 0.9rem; color: #aaa; margin-top: 15px;">(카드를 터치하면 뜻이 나와요!)</p>
                </div>
                
                <div class="card-face card-back">
                    <div class="meaning" id="ko-meaning"></div>
                    <div class="example" id="example-sentence"></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-nav" onclick="prevWord()">◀ 이전</button>
            <button class="btn-nav" onclick="nextWord()">다음 ▶</button>
        </div>
        <div class="master-controls">
            <button class="btn-know" onclick="markAsKnown()">✅ 이 단어는 다 외웠어요!</button>
        </div>
    </div>

    <div id="success-message">
        <h1>🎉 위대한 도전을 마쳤습니다! 🎉</h1>
        <p style="font-size: 1.5rem; color: #555;">초등학교 4학년 필수 영단어 100개를<br>모두 외웠습니다. 정말 대단해요!</p>
        <button class="btn-restart" onclick="location.reload()">처음부터 다시 복습하기 🔄</button>
    </div>

            { en: "Leg", ko: "다리", ex: "My legs are long." },
            { en: "Foot", ko: "발", ex: "Stamp your feet." },
            { en: "School", ko: "학교", ex: "I go to school." },
            { en: "Class", ko: "수업, 반", ex: "Welcome to my class." },

            { en: "Eraser", ko: "지우개", ex: "Can I borrow your eraser?" },
            { en: "Bag", ko: "가방", ex: "Put it in your bag." },
            { en: "Desk", ko: "책상", ex: "Sit at your desk." },

            { en: "Stand", ko: "서다", ex: "Stand up, please." },

            { en: "Drink", ko: "마시다", ex: "Drink your milk." },
            { en: "Sleep", ko: "자다", ex: "It's time to sleep." },
            { en: "Play", ko: "놀다, 경기하다", ex: "Let's play a game." },
            { en: "Study", ko: "공부하다", ex: "I study English." },
            { en: "Read", ko: "읽다", ex: "Read this book." },
            { en: "Write", ko: "쓰다", ex: "Write your name." },
            { en: "Listen", ko: "듣다", ex: "Listen to the music." },
            { en: "See", ko: "보다", ex: "I see a bird." },
            { en: "Help", ko: "돕다", ex: "Can you help me?" },
            { en: "Wash", ko: "씻다", ex: "Wash your face." },
            { en: "Big", ko: "큰", ex: "That is a big elephant." },
            { en: "Small", ko: "작은", ex: "This is a small mouse." },
            { en: "Tall", ko: "키가 큰", ex: "He is very tall." },
            { en: "Short", ko: "짧은, 키가 작은", ex: "The pencil is short." },
            { en: "Long", ko: "긴", ex: "She has long hair." },
            { en: "Good", ko: "좋은", ex: "Have a good day." },
            { en: "Bad", ko: "나쁜", ex: "That is a bad idea." },
            { en: "Happy", ko: "행복한", ex: "I am happy today." },
            { en: "Sad", ko: "슬픈", ex: "Why are you sad?" },
            { en: "Angry", ko: "화난", ex: "He is very angry." },
            { en: "Hot", ko: "뜨거운, 더운", ex: "The weather is hot." },
            { en: "Cold", ko: "차가운, 추운", ex: "It is cold outside." },
            { en: "Hungry", ko: "배고픈", ex: "I am hungry." },
            { en: "Fast", ko: "빠른", ex: "The car is fast." },
            { en: "Cute", ko: "귀여운", ex: "The baby is cute." }
        ];

        let learningWords = [...allWords];
        let currentIndex = 0;

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        shuffleArray(learningWords);

        const cardInner = document.getElementById('card-inner');
        const flashcard = document.getElementById('flashcard');
        const progressText = document.getElementById('progress-text');
        const wordImage = document.getElementById('word-image');
        
        flashcard.addEventListener('click', () => {
            cardInner.classList.toggle('is-flipped');
        });

        function updateCard() {
            if (learningWords.length === 0) {
                document.getElementById('app-container').style.display = 'none';
                document.getElementById('success-message').style.display = 'flex';
                return;
            }

            cardInner.classList.remove('is-flipped');
            
            if (currentIndex >= learningWords.length) {
                currentIndex = 0;
            }

            progressText.innerText = `남은 단어: ${learningWords.length}개 (현재: ${currentIndex + 1}번째)`;
            
            setTimeout(() => {
                const currentWordObj = learningWords[currentIndex];
                
                wordImage.src = `https://placehold.co/400x150/FFE4E1/FF6B6B?text=${currentWordObj.en}`;
                wordImage.alt = currentWordObj.en + " image";

                document.getElementById('en-word').innerText = currentWordObj.en;
                document.getElementById('ko-meaning').innerText = currentWordObj.ko;
                document.getElementById('example-sentence').innerText = currentWordObj.ex;
            }, 150); 
        }

        function nextWord() {
            if (learningWords.length === 0) return;
            if (currentIndex < learningWords.length - 1) {
                currentIndex++;
            } else {
                alert("한 바퀴 다 돌았습니다! 모르는 단어를 다시 섞어서 보여줍니다.");
                shuffleArray(learningWords);
                currentIndex = 0;
            }
            updateCard();
        }

        function prevWord() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function markAsKnown() {
            learningWords.splice(currentIndex, 1);
            updateCard();
        }

        function playAudio(event) {
            event.stopPropagation(); 
            const text = learningWords[currentIndex].en;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US'; 
            window.speechSynthesis.speak(utterance);
        }

        updateCard();
    </script>
</body>
</html>
