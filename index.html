<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초4 영단어 마스터 (주간/월간 통계 추가)</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        /* 🎨 듀오링고 컬러 팔레트 */
        :root {
            --green: #58cc02; --green-dark: #58a700;
            --blue: #1cb0f6; --blue-dark: #1899d6;
            --red: #ff4b4b; --red-dark: #ea2b2b;
            --purple: #ce82ff; --purple-dark: #a559ce;
            --yellow: #ffc800; --yellow-dark: #cc9600;
            --gray-light: #e5e5e5; --gray-dark: #afafaf;
            --text-main: #4b4b4b; --text-sub: #777;
            --bg-color: #ffffff;
        }

        body { 
            font-family: 'Nunito', 'Malgun Gothic', sans-serif; 
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; 
            min-height: 100vh; margin: 0; padding: 60px 20px 20px 20px; box-sizing: border-box;
        }
        
        h1, h2 { color: var(--text-main); margin-bottom: 5px; text-align: center; font-weight: 900; }
        .subtitle { color: var(--text-sub); margin-bottom: 25px; text-align: center; font-weight: 700;}

        /* ⏱ 글로벌 타이머 UI */
        #global-timer-display {
            position: fixed; top: 15px; right: 15px; background: rgba(255,255,255,0.95); 
            border: 2px solid var(--gray-light); padding: 8px 15px; border-radius: 20px; 
            font-weight: 900; color: var(--text-main); box-shadow: 0 4px 0 var(--gray-light); 
            z-index: 1000; display: flex; align-items: center; gap: 5px; font-size: 1.1rem;
        }

        .screen { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 500px; padding-bottom: 30px;}
        .screen.active { display: flex; }

        /* 공통 버튼 */
        .btn {
            width: 100%; border: none; border-radius: 16px; color: white; cursor: pointer; 
            font-weight: 800; font-size: 1.2rem; text-align: center; box-sizing: border-box;
            transition: transform 0.1s, box-shadow 0.1s; letter-spacing: 0.5px; margin-bottom: 15px;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent !important; }

        .btn-green { background-color: var(--green); box-shadow: 0 4px 0 var(--green-dark); padding: 18px; }
        .btn-blue { background-color: var(--blue); box-shadow: 0 4px 0 var(--blue-dark); padding: 18px; }
        .btn-red { background-color: var(--red); box-shadow: 0 4px 0 var(--red-dark); padding: 18px; }
        .btn-purple { background-color: var(--purple); box-shadow: 0 4px 0 var(--purple-dark); padding: 18px; }
        .btn-gray { background-color: var(--gray-light); color: var(--gray-dark); box-shadow: 0 4px 0 #d9d9d9; padding: 15px; }

        .mini-profile {
            width: 100%; background-color: white; border: 2px solid var(--gray-light); border-radius: 20px; 
            padding: 20px; margin-bottom: 30px; text-align: center; box-sizing: border-box;
        }
        .level-title { font-size: 1.4rem; font-weight: 900; color: var(--yellow); margin-bottom: 10px; }

        .progress-bar-bg { width: 100%; background-color: var(--gray-light); border-radius: 12px; height: 20px; margin: 10px 0; overflow: hidden; position: relative;}
        .progress-bar-fill { height: 100%; background-color: var(--yellow); border-radius: 12px; transition: width 0.4s ease; }
        .progress-bar-fill.green-fill { background-color: var(--green); }
        .progress-text { position: absolute; width: 100%; text-align: center; top: 0; font-size: 0.9rem; font-weight: 800; color: #fff; text-shadow: 0px 1px 1px rgba(0,0,0,0.2);}
        
        .top-progress { display: flex; align-items: center; width: 100%; gap: 15px; margin-bottom: 20px;}
        .close-btn { background: none; border: none; font-size: 1.5rem; color: var(--gray-dark); cursor: pointer; font-weight: 900;}

        /* 플래시카드 & 퀴즈 컨테이너 설정 */
        .stage-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; width: 100%; margin-bottom: 20px; }
        .stage-btn { padding: 20px 0; font-size: 1.3rem; color: white; border: none; border-radius: 16px; cursor: pointer; font-weight: 900; transition: transform 0.1s; }
        .stage-btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent !important; }
        .stage-btn.learn-color { background-color: var(--green); box-shadow: 0 4px 0 var(--green-dark); }
        .stage-btn.quiz-color { background-color: var(--blue); box-shadow: 0 4px 0 var(--blue-dark); }

        .card-container { width: 100%; height: 380px; perspective: 1000px; margin-bottom: 25px; cursor: pointer; }
        .card { width: 100%; height: 100%; position: relative; transition: transform 0.5s; transform-style: preserve-3d; }
        .card.is-flipped { transform: rotateY(180deg); }
        .card-face { 
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 24px; 
            border: 2px solid var(--gray-light); box-shadow: 0 8px 0 var(--gray-light); display: flex; flex-direction: column; 
            align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box; background-color: #fff;
        }
        .card-back { transform: rotateY(180deg); border-color: #d7ffb8; background-color: #f7ffe6;}
        
        .word-img { width: 70%; height: 130px; border-radius: 16px; margin-bottom: 20px; object-fit: cover; }
        .word { font-size: 3.5rem; font-weight: 900; margin-bottom: 5px; color: var(--text-main); }
        .meaning { font-size: 2.5rem; font-weight: 800; margin-bottom: 15px; color: var(--green); }
        .example { font-size: 1.2rem; color: var(--text-sub); word-break: keep-all; line-height: 1.4; font-weight: 700;}
        
        .nav-controls { display: flex; gap: 15px; width: 100%; margin-bottom: 10px;}
        .nav-controls .btn { padding: 15px; font-size: 1.2rem; margin-bottom: 0;}
        
        .audio-icon-btn { 
            background-color: var(--blue); color: white; border: none; border-radius: 50%; width: 50px; height: 50px;
            font-size: 1.5rem; display: flex; align-items: center; justify-content: center; margin-top: 10px;
            box-shadow: 0 4px 0 var(--blue-dark); cursor: pointer; transition: 0.1s;
        }
        .audio-icon-btn:active { transform: translateY(4px); box-shadow: none; }

        .quiz-word-box {
            width: 100%; background-color: white; border: 2px solid var(--gray-light); border-radius: 24px; 
            padding: 40px 20px; text-align: center; box-shadow: 0 8px 0 var(--gray-light); margin-bottom: 30px; box-sizing: border-box;
        }
        .quiz-word { font-size: 3.5rem; font-weight: 900; color: var(--text-main); margin-bottom: 10px; }
        .quiz-options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; margin-bottom: 15px; }
        .quiz-option-btn {
            padding: 25px 10px; font-size: 1.3rem; background-color: #ffffff; color: var(--text-main);
            border: 2px solid var(--gray-light); border-radius: 16px; cursor: pointer; font-weight: 800;
            box-shadow: 0 4px 0 var(--gray-light); transition: 0.1s; word-break: keep-all;
        }
        .quiz-option-btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
        .quiz-option-btn.correct { background-color: #d7ffb8; color: var(--green-dark); border-color: var(--green); box-shadow: 0 4px 0 var(--green-dark); }
        .quiz-option-btn.wrong { background-color: #ffdfe0; color: var(--red-dark); border-color: var(--red); box-shadow: 0 4px 0 var(--red-dark); }

        /* 📊 학습 이력 및 통계 스타일 (새로 추가됨) */
        .stats-card {
            width: 100%; background-color: white; border: 2px solid var(--gray-light); border-radius: 20px;
            padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 0 var(--gray-light); box-sizing: border-box; text-align: center;
        }
        .stats-title { font-size: 1.2rem; font-weight: 900; margin-bottom: 10px; }
        .stats-row { display: flex; justify-content: space-around; font-weight: 800; font-size: 1.1rem; color: var(--text-sub); }
        .stats-val { color: var(--text-main); font-size: 1.3rem;}

        /* 월별 탭 */
        .tab-container { display: flex; gap: 10px; overflow-x: auto; width: 100%; padding-bottom: 10px; margin-bottom: 10px; scrollbar-width: none; }
        .tab-container::-webkit-scrollbar { display: none; }
        .tab-btn {
            padding: 10px 25px; border-radius: 16px; border: 2px solid var(--gray-light); background: #fff;
            color: var(--gray-dark); font-weight: 900; font-size: 1.1rem; cursor: pointer; white-space: nowrap; transition: 0.1s; box-shadow: 0 4px 0 var(--gray-light);
        }
        .tab-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--gray-light); }
        .tab-btn.active { border-color: var(--purple); background: var(--purple); color: #fff; box-shadow: 0 4px 0 var(--purple-dark); transform: translateY(-2px); }

        .history-item { 
            width: 100%; background-color: white; border: 2px solid var(--gray-light); border-radius: 16px; 
            padding: 20px; margin-bottom: 15px; box-sizing: border-box; box-shadow: 0 4px 0 var(--gray-light);
        }
        .history-item strong { color: var(--text-main); font-size: 1.2rem; display: block; margin-bottom: 10px;}
        .history-stat { display: flex; justify-content: space-between; font-weight: 700; color: var(--text-sub); margin-bottom: 5px;}
        .history-detail { font-size: 0.95rem; color: var(--purple-dark); font-weight: 800; margin-top: 10px; background: #f4f0ff; padding: 10px; border-radius: 10px;}

        .result-image { font-size: 6rem; margin: 20px 0; }
    </style>
</head>
<body>

    <!-- ⏱ 우측 상단 고정 타이머 -->
    <div id="global-timer-display">
        <span>⏱</span> <span id="timer-text">00:00</span>
    </div>

    <!-- 1. 메인 메뉴 화면 -->
    <div id="main-menu" class="screen active">
        <h1>초4 영단어 마스터</h1>
        
        <div class="mini-profile">
            <div class="level-title" id="mini-level-title">Lv.1 영단어 새싹 🌱</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="mini-exp-bar" style="width: 0%;"></div>
                <div class="progress-text" id="mini-exp-text">0 / 100 EXP</div>
            </div>
        </div>

        <button class="btn btn-green" onclick="openStageSelection('learn')">📖 단어 학습하기</button>
        <button class="btn btn-blue" onclick="openStageSelection('quiz')">🎮 단어 퀴즈풀기</button>
        <button class="btn btn-red" onclick="startWrongWordsMode()">📝 내 오답노트 복습</button>
        <button class="btn btn-purple" onclick="renderHistoryScreen()">📊 학습 이력 & 통계</button>
    </div>

    <!-- 2. 단계 선택 화면 -->
    <div id="stage-selection" class="screen">
        <div class="top-progress">
            <button class="close-btn" onclick="goHome()">✖</button>
            <div class="progress-bar-bg" style="margin: 0;"><div class="progress-bar-fill" style="width: 100%;"></div></div>
        </div>
        <h2 id="stage-screen-title">단계 선택</h2>
        <p class="subtitle">1~11단계는 필수 기초 단어입니다.</p>
        <div class="stage-grid" id="stage-grid"></div>
        <button class="btn btn-gray" onclick="goHome()">🏠 메인 메뉴로</button>
    </div>

    <!-- 3. 학습 화면 -->
    <div id="learn-container" class="screen">
        <div class="top-progress">
            <button class="close-btn" onclick="openStageSelection(currentMode)">✖</button>
            <div class="progress-bar-bg"><div class="progress-bar-fill green-fill" id="learn-progress-bar" style="width: 0%;"></div></div>
        </div>
        
        <div class="card-container" id="flashcard">
            <div class="card" id="card-inner">
                <div class="card-face card-front">
                    <img id="word-image" class="word-img" src="" alt="word image">
                    <div class="word" id="en-word">Loading...</div>
                    <button class="audio-icon-btn" onclick="playAudio(event)">🔊</button>
                    <p style="font-size: 1rem; color: #aaa; margin-top: 15px; font-weight: 700;">(카드를 터치하세요)</p>
                </div>
                
                <div class="card-face card-back">
                    <div class="meaning" id="ko-meaning"></div>
                    <div class="example" id="example-sentence"></div>
                </div>
            </div>
        </div>

        <div class="nav-controls">
            <button class="btn btn-gray" onclick="prevWord()">◀ 이전</button>
            <button class="btn btn-blue" onclick="nextWord()">다음 ▶</button>
        </div>
        <button class="btn btn-green" style="width: 100%;" onclick="markAsKnown()">✅ 이 단어는 다 외웠어요!</button>
        <button class="btn btn-gray" style="margin-top: 15px;" onclick="goHome()">🏠 메인 메뉴로</button>
    </div>

    <!-- 4. 퀴즈 화면 -->
    <div id="quiz-container" class="screen">
        <div class="top-progress">
            <button class="close-btn" onclick="openStageSelection(currentMode)">✖</button>
            <div class="progress-bar-bg"><div class="progress-bar-fill green-fill" id="quiz-progress-bar" style="width: 0%;"></div></div>
        </div>
        
        <div class="quiz-word-box">
            <div class="quiz-word" id="quiz-en-word">Word</div>
            <button class="audio-icon-btn" style="margin: 0 auto;" onclick="playAudio(event)">🔊</button>
        </div>

        <div class="quiz-options-grid" id="quiz-options"></div>
        <button class="btn btn-gray" style="margin-top: 15px;" onclick="goHome()">🏠 메인 메뉴로</button>
    </div>

    <!-- 5. 📊 통계 및 학습 이력 화면 (개편됨) -->
    <div id="history-container" class="screen">
        <div class="top-progress">
            <button class="close-btn" onclick="goHome()">✖</button>
            <div style="flex-grow: 1; text-align: center; font-weight: 900; font-size: 1.2rem; color: var(--text-main);">나의 학습 기록</div>
        </div>
        
        <!-- 주간 통계 -->
        <div class="stats-card" style="border-color: var(--yellow);">
            <div class="stats-title" style="color: var(--yellow-dark);">🌟 이번 주 누적 통계</div>
            <div class="stats-row">
                <div>⏱ 시간<br><span class="stats-val" id="weekly-time">0분 0초</span></div>
                <div>📖 단어<br><span class="stats-val" id="weekly-words" style="color: var(--green);">0개</span></div>
            </div>
        </div>

        <!-- 월별 탭 -->
        <div class="tab-container" id="month-tabs"></div>

        <!-- 월간 통계 -->
        <div class="stats-card" style="border-color: var(--purple);">
            <div class="stats-title" id="monthly-title" style="color: var(--purple-dark);">0월 통계</div>
            <div class="stats-row">
                <div>⏱ 시간<br><span class="stats-val" id="monthly-time">0분 0초</span></div>
                <div>📖 단어<br><span class="stats-val" id="monthly-words" style="color: var(--green);">0개</span></div>
            </div>
        </div>

        <!-- 일자별 상세 이력 리스트 -->
        <div style="width: 100%;" id="history-list"></div>
        
        <button class="btn btn-gray" style="margin-top: 15px;" onclick="goHome()">🏠 메인 메뉴로 돌아가기</button>
    </div>

    <!-- 6. 결과 화면 -->
    <div id="result-message" class="screen">
        <div class="result-image">🎉</div>
        <h1 id="result-title" style="color: var(--yellow);">레슨 완료!</h1>
        <p id="result-desc" style="font-size: 1.3rem; font-weight: 800; color: var(--text-sub); text-align: center; margin-bottom: 20px;">잘 하셨어요!</p>
        
        <div class="mini-profile" style="background-color: #fff9e6; border-color: var(--yellow);">
            <div class="level-title" style="color: var(--yellow-dark);">EXP 획득</div>
            <div class="level-title" id="result-score" style="font-size: 2rem;">+20</div>
        </div>

        <button class="btn btn-green" onclick="handleResultContinue()">계속하기</button>
    </div>

    <script>
        // ✅ 전체 단어 데이터 175개
        const allWords = [

            { en: "Angry", ko: "화난", ex: "" }, { en: "Sad", ko: "슬픈", ex: "" }, { en: "Hungry", ko: "배고픈", ex: "" }, { en: "Happy", ko: "행복한", ex: "" }, { en: "Book", ko: "책", ex: "" }, { en: "Bird", ko: "새", ex: "" }, { en: "Violin", ko: "바이올린", ex: "" }, { en: "Voice", ko: "목소리", ex: "" }, { en: "Cap", ko: "모자 (야구모자)", ex: "" }, { en: "Bag", ko: "가방", ex: "" },

            { en: "Saturday", ko: "토요일", ex: "" }, { en: "Sun", ko: "태양, 해", ex: "" }, { en: "Run", ko: "달리다", ex: "" }, { en: "Red", ko: "빨간색", ex: "" }, { en: "Bed", ko: "침대", ex: "" }, { en: "School", ko: "학교", ex: "" }, { en: "Breakfast", ko: "아침 식사", ex: "" }, { en: "Dinner", ko: "저녁 식사", ex: "" }, { en: "Lunch", ko: "점심 식사", ex: "" }, { en: "Big", ko: "큰", ex: "" },

            { en: "Face", ko: "얼굴", ex: "Wash your face." }, { en: "Hand", ko: "손", ex: "Wash your hands." }, { en: "Leg", ko: "다리", ex: "My legs are long." }, { en: "Foot", ko: "발", ex: "Stamp your feet." }, { en: "Class", ko: "수업, 반", ex: "Welcome to my class." }, { en: "Pencil", ko: "연필", ex: "I have a pencil." }, { en: "Eraser", ko: "지우개", ex: "Can I borrow your eraser?" }, { en: "Desk", ko: "책상", ex: "Sit at your desk." }, { en: "Chair", ko: "의자", ex: "Sit on the chair." }, { en: "Window", ko: "창문", ex: "Open the window." },

            { en: "Banana", ko: "바나나", ex: "This is a banana." }, { en: "Grape", ko: "포도", ex: "Grapes are sweet." }, { en: "Meat", ko: "고기", ex: "Do you like meat?" }, { en: "Cheese", ko: "치즈", ex: "Mice like cheese." }, { en: "Cake", ko: "케이크", ex: "Happy birthday!" }, { en: "Yellow", ko: "노란색", ex: "A banana is yellow." }, { en: "Green", ko: "초록색", ex: "The tree is green." }, { en: "Moon", ko: "달", ex: "Look at the moon." }, { en: "Star", ko: "별", ex: "I see a star." }, { en: "Rain", ko: "비", ex: "It is raining." },
            { en: "Snow", ko: "눈", ex: "It is snowing." }, { en: "Tree", ko: "나무", ex: "That is a tall tree." }, { en: "Flower", ko: "꽃", ex: "This flower is beautiful." }, { en: "Today", ko: "오늘", ex: "Today is Monday." }, { en: "Tomorrow", ko: "내일", ex: "See you tomorrow." }, { en: "Go", ko: "가다", ex: "Let's go home." }, { en: "Come", ko: "오다", ex: "Come here, please." }, { en: "Walk", ko: "걷다", ex: "Let's walk together." }, { en: "Jump", ko: "점프하다", ex: "Jump up high." }, { en: "Sit", ko: "앉다", ex: "Sit down, please." },
            { en: "Stand", ko: "서다", ex: "Stand up, please." }, { en: "Eat", ko: "먹다", ex: "I want to eat pizza." }, { en: "Drink", ko: "마시다", ex: "Drink your milk." }, { en: "Sleep", ko: "자다", ex: "It's time to sleep." }, { en: "Play", ko: "놀다", ex: "Let's play a game." }, { en: "Study", ko: "공부하다", ex: "I study English." }, { en: "Write", ko: "쓰다", ex: "Write your name." }, { en: "Listen", ko: "듣다", ex: "Listen to the music." }, { en: "See", ko: "보다", ex: "I see a bird." }, { en: "Help", ko: "돕다", ex: "Can you help me?" },
            { en: "Wash", ko: "씻다", ex: "Wash your face." }, { en: "Small", ko: "작은", ex: "This is a small mouse." }, { en: "Short", ko: "짧은", ex: "The pencil is short." }, { en: "Hot", ko: "뜨거운", ex: "The weather is hot." }, { en: "Cute", ko: "귀여운", ex: "The baby is cute." }
        ];

        let currentMode = ''; 
        let targetWords = [];
        let currentIndex = 0;
        let originalWordsCount = 0;
        let currentStageNumber = 0;
        let quizScore = 0;
        let isAnswered = false;
        let totalExp = 0;
        
        // ⏱ 타이머 변수
        let activeStudy = false;
        let dailySeconds = 0;
        let timerInterval = null;

        // 📊 월별 탭 변수
        let currentHistoryMonth = "";

        // 고음질 음성
        let availableVoices = [];
        window.speechSynthesis.onvoiceschanged = () => { availableVoices = window.speechSynthesis.getVoices(); };

        window.onload = () => { 
            loadExp(); 
            startGlobalTimer(); 
        };

        /* ================= ⏱ 타이머 및 유틸 로직 ================= */
        function getTodayStr() {
            const offset = new Date().getTimezoneOffset() * 60000;
            return new Date(Date.now() - offset).toISOString().split('T')[0];
        }

        // 초(seconds)를 보기 좋은 시/분/초 텍스트로 변환
        function formatTimeText(totalSec) {
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            if (h > 0) return `${h}시간 ${m}분 ${s}초`;
            if (m > 0) return `${m}분 ${s}초`;
            return `${s}초`;
        }

        function startGlobalTimer() {
            const today = getTodayStr();
            const history = JSON.parse(localStorage.getItem('englishStudyHistory')) || {};
            dailySeconds = history[today] ? (history[today].time || 0) : 0;
            updateTimerUI();

            timerInterval = setInterval(() => {
                if (activeStudy) {
                    dailySeconds++;
                    updateTimerUI();
                    saveTimeOnly(); 
                }
            }, 1000);
        }

        function updateTimerUI() {
            const m = Math.floor(dailySeconds / 60).toString().padStart(2, '0');
            const s = (dailySeconds % 60).toString().padStart(2, '0');
            document.getElementById('timer-text').innerText = `${m}:${s}`;
        }

        function saveTimeOnly() {
            const today = getTodayStr();
            let history = JSON.parse(localStorage.getItem('englishStudyHistory')) || {};
            if (!history[today]) history[today] = { time: 0, words: 0, learn: [], quiz: [] };
            history[today].time = dailySeconds;
            localStorage.setItem('englishStudyHistory', JSON.stringify(history));
        }

        function saveStageCompletion(completedWords) {
            const today = getTodayStr();
            let history = JSON.parse(localStorage.getItem('englishStudyHistory')) || {};
            if (!history[today]) history[today] = { time: dailySeconds, words: 0, learn: [], quiz: [] };
            
            history[today].words += completedWords;
            if (currentMode === 'learn') {
                if (!history[today].learn) history[today].learn = [];
                if (!history[today].learn.includes(currentStageNumber)) history[today].learn.push(currentStageNumber);
            } else if (currentMode === 'quiz') {
                if (!history[today].quiz) history[today].quiz = [];
                if (!history[today].quiz.includes(currentStageNumber)) history[today].quiz.push(currentStageNumber);
            }
            localStorage.setItem('englishStudyHistory', JSON.stringify(history));
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            loadExp(); 
        }

        function getLevelInfo(exp) {
            const level = Math.floor(exp / 100) + 1;
            const currentLevelExp = exp % 100;
            let title = "영단어 새싹 🌱";
            if (level >= 2 && level < 5) title = "영단어 탐험가 🧭";
            else if (level >= 5 && level < 10) title = "영단어 기사 ⚔️";
            else if (level >= 10 && level < 20) title = "영단어 마법사 🧙‍♂️";
            else if (level >= 20) title = "영단어 마스터 👑";
            return { level, title, currentLevelExp, percent: currentLevelExp };
        }

        function loadExp() {
            totalExp = parseInt(localStorage.getItem('englishTotalExp')) || 0;
            const info = getLevelInfo(totalExp);
            document.getElementById('mini-level-title').innerText = `Lv.${info.level} ${info.title}`;
            document.getElementById('mini-exp-text').innerText = `${info.currentLevelExp} / 100 EXP`;
            document.getElementById('mini-exp-bar').style.width = `${info.percent}%`;
        }

        function addExp(amount) {
            totalExp += amount;
            localStorage.setItem('englishTotalExp', totalExp);
        }

        function openStageSelection(mode) {
            activeStudy = false; 
            currentMode = mode;
            const stageGrid = document.getElementById('stage-grid');
            stageGrid.innerHTML = ''; 
            const btnColorClass = mode === 'learn' ? 'learn-color' : 'quiz-color';
            document.getElementById('stage-screen-title').innerText = mode === 'learn' ? '학습 단계 선택' : '퀴즈 단계 선택';

            const totalStages = Math.ceil(allWords.length / 10);
            for (let i = 1; i <= totalStages; i++) {
                const btn = document.createElement('button');
                btn.className = `stage-btn ${btnColorClass}`;
                btn.innerText = `${i}`;
                btn.onclick = () => startStage(i);
                stageGrid.appendChild(btn);
            }
            showScreen('stage-selection');
        }

        function goHome() { 
            activeStudy = false; 
            showScreen('main-menu'); 
        }

        function startStage(stageNumber) {
            activeStudy = true; 
            currentStageNumber = stageNumber;
            const startIndex = (stageNumber - 1) * 10;
            
            targetWords = allWords.slice(startIndex, startIndex + 10);
            originalWordsCount = targetWords.length;
            shuffleArray(targetWords);
            currentIndex = 0;

            if (currentMode === 'learn') {
                updateFlashcard();
                showScreen('learn-container');
            } else if (currentMode === 'quiz') {
                quizScore = 0;
                updateQuiz();
                showScreen('quiz-container');
            }
        }

        function startWrongWordsMode() {
            currentMode = 'wrong';
            const wrongWords = JSON.parse(localStorage.getItem('englishWrongWords')) || [];
            if (wrongWords.length === 0) return alert("틀린 단어가 없습니다! 아주 잘하고 있어요! 🎉");

            targetWords = wrongWords.map(enText => allWords.find(w => w.en === enText)).filter(w => w !== undefined);
            if (targetWords.length === 0) {
                localStorage.removeItem('englishWrongWords');
                return alert("틀린 단어가 없습니다!");
            }

            activeStudy = true; 
            originalWordsCount = targetWords.length;
            shuffleArray(targetWords);
            currentIndex = 0;

            updateFlashcard();
            showScreen('learn-container');
        }

        function saveWrongWord(wordEn) {
            let wrongWords = JSON.parse(localStorage.getItem('englishWrongWords')) || [];
            if (!wrongWords.includes(wordEn)) {
                wrongWords.push(wordEn);
                localStorage.setItem('englishWrongWords', JSON.stringify(wrongWords));
            }
        }

        function removeWrongWord(wordEn) {
            let wrongWords = JSON.parse(localStorage.getItem('englishWrongWords')) || [];
            wrongWords = wrongWords.filter(w => w !== wordEn);
            localStorage.setItem('englishWrongWords', JSON.stringify(wrongWords));
        }

        function handleResultContinue() {
            activeStudy = false;
            if (currentMode === 'wrong') {
                goHome();
            } else {
                openStageSelection(currentMode);
            }
        }

        /* ================= 📊 주간/월간 통계 렌더링 ================= */
        // 오늘을 기준으로 '월요일'과 '일요일' 날짜 객체를 구하는 함수
        function getWeekRange() {
            const today = new Date();
            const day = today.getDay() || 7; 
            const monday = new Date(today);
            monday.setDate(today.getDate() - day + 1);
            monday.setHours(0,0,0,0);
            
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            sunday.setHours(23,59,59,999);
            return { monday, sunday };
        }

        function renderHistoryScreen() {
            activeStudy = false; 
            showScreen('history-container');
            
            const history = JSON.parse(localStorage.getItem('englishStudyHistory')) || {};
            const dates = Object.keys(history).sort((a, b) => b.localeCompare(a)); 
            
            // 1. 이번 주 통계 계산
            const { monday, sunday } = getWeekRange();
            let weeklyTime = 0, weeklyWords = 0;
            
            dates.forEach(d => {
                const parts = d.split('-');
                const dObj = new Date(parts[0], parts[1]-1, parts[2]); // local time
                if (dObj >= monday && dObj <= sunday) {
                    weeklyTime += history[d].time || 0;
                    weeklyWords += history[d].words || 0;
                }
            });
            document.getElementById('weekly-time').innerText = formatTimeText(weeklyTime);
            document.getElementById('weekly-words').innerText = `${weeklyWords}개`;

            // 2. 월별 탭 생성
            // 데이터가 있는 달 추출 (예: '2026-08')
            const monthSet = new Set(dates.map(d => d.substring(0, 7)));
            const months = Array.from(monthSet).sort().reverse(); 
            const thisMonthStr = getTodayStr().substring(0, 7);
            
            if (months.length === 0) months.push(thisMonthStr);
            if (!currentHistoryMonth || !months.includes(currentHistoryMonth)) {
                currentHistoryMonth = months[0]; // 없으면 가장 최근 기록 달로 설정
            }

            const tabsContainer = document.getElementById('month-tabs');
            tabsContainer.innerHTML = '';
            months.forEach(m => {
                const monthNum = parseInt(m.split('-')[1]);
                const btn = document.createElement('button');
                btn.className = `tab-btn ${m === currentHistoryMonth ? 'active' : ''}`;
                btn.innerText = `${monthNum}월`;
                btn.onclick = () => { currentHistoryMonth = m; renderHistoryScreen(); };
                tabsContainer.appendChild(btn);
            });

            // 3. 선택된 월의 리스트 및 월간 통계 계산
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            
            const monthDates = dates.filter(d => d.startsWith(currentHistoryMonth));
            let monthlyTime = 0, monthlyWords = 0;

            if (monthDates.length === 0) {
                historyList.innerHTML = '<div class="history-item" style="text-align:center;">이 달에는 학습 기록이 없어요.</div>';
            } else {
                monthDates.forEach(date => {
                    const data = history[date];
                    monthlyTime += data.time || 0;
                    monthlyWords += data.words || 0;
                    
                    const timeStr = formatTimeText(data.time || 0);
                    const learnStr = (data.learn && data.learn.length > 0) ? data.learn.sort((a,b)=>a-b).join(', ') + '단계' : '없음';
                    const quizStr = (data.quiz && data.quiz.length > 0) ? data.quiz.sort((a,b)=>a-b).join(', ') + '단계' : '없음';
                    
                    historyList.innerHTML += `
                        <div class="history-item">
                            <strong>📅 ${date}</strong>
                            <div class="history-stat"><span>📖 ${data.words}개 단어</span><span>⏱ ${timeStr}</span></div>
                            <div class="history-detail">
                                ✔ 학습: ${learnStr} <br>
                                ✔ 퀴즈: ${quizStr}
                            </div>
                        </div>
                    `;
                });
            }

            const dispMonth = parseInt(currentHistoryMonth.split('-')[1]);
            document.getElementById('monthly-title').innerText = `${dispMonth}월 누적 통계`;
            document.getElementById('monthly-time').innerText = formatTimeText(monthlyTime);
            document.getElementById('monthly-words').innerText = `${monthlyWords}개`;
        }

        /* ================= 플래시카드 로직 ================= */
        const cardInner = document.getElementById('card-inner');
        document.getElementById('flashcard').addEventListener('click', () => { cardInner.classList.toggle('is-flipped'); });

        function updateFlashcard() {
            if (targetWords.length === 0) {
                activeStudy = false; 
                saveStageCompletion(originalWordsCount); 
                
                if (currentMode === 'wrong') {
                    showResultScreen("오답 복습 끝!", "모든 단어를 완벽하게 외웠어요!", "+0");
                } else {
                    const expGained = originalWordsCount * 2;
                    addExp(expGained);
                    showResultScreen("레슨 완료!", "정말 훌륭해요!", `+${expGained}`);
                }
                return;
            }

            cardInner.classList.remove('is-flipped');
            if (currentIndex >= targetWords.length) currentIndex = 0;

            const progressPercent = (currentIndex / targetWords.length) * 100;
            document.getElementById('learn-progress-bar').style.width = `${progressPercent}%`;
            
            setTimeout(() => {
                const currentWord = targetWords[currentIndex];
                const wordImage = document.getElementById('word-image');
                wordImage.src = `https://placehold.co/400x150/f3f4f6/1cb0f6?text=${currentWord.en}`;
                document.getElementById('en-word').innerText = currentWord.en;
                document.getElementById('ko-meaning').innerText = currentWord.ko;
                document.getElementById('example-sentence').innerText = currentWord.ex || "";
            }, 150); 
        }

        function nextWord() {
            if (targetWords.length === 0) return;
            if (currentIndex < targetWords.length - 1) { currentIndex++; } 
            else { shuffleArray(targetWords); currentIndex = 0; }
            updateFlashcard();
        }

        function prevWord() {
            if (currentIndex > 0) { currentIndex--; updateFlashcard(); }
        }

        function markAsKnown() {
            const knownWord = targetWords[currentIndex].en;
            targetWords.splice(currentIndex, 1);
            if (currentMode === 'wrong') removeWrongWord(knownWord); 
            updateFlashcard();
        }

        /* ================= 퀴즈 로직 ================= */
        function updateQuiz() {
            if (currentIndex >= targetWords.length) {
                activeStudy = false; 
                saveStageCompletion(targetWords.length);
                const expGained = quizScore * 5;
                addExp(expGained);
                showResultScreen("퀴즈 완료!", `${targetWords.length}문제 중 ${quizScore}문제를 맞혔어요!`, `+${expGained}`);
                return;
            }

            isAnswered = false;
            const progressPercent = (currentIndex / targetWords.length) * 100;
            document.getElementById('quiz-progress-bar').style.width = `${progressPercent}%`;

            const currentWord = targetWords[currentIndex];
            document.getElementById('quiz-en-word').innerText = currentWord.en;

            let options = [currentWord.ko];
            while(options.length < 4) {
                const randomWord = allWords[Math.floor(Math.random() * allWords.length)];
                if (!options.includes(randomWord.ko)) options.push(randomWord.ko);
            }
            shuffleArray(options);

            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkQuizAnswer(btn, opt, currentWord);
                optionsContainer.appendChild(btn);
            });
        }

        function checkQuizAnswer(clickedBtn, selectedKo, currentWordObj) {
            if (isAnswered) return;
            isAnswered = true;
            const correctKo = currentWordObj.ko;
            const buttons = document.getElementById('quiz-options').getElementsByTagName('button');

            if (selectedKo === correctKo) {
                clickedBtn.classList.add('correct');
                quizScore++;
            } else {
                clickedBtn.classList.add('wrong');
                saveWrongWord(currentWordObj.en); 
                for(let btn of buttons) {
                    if (btn.innerText === correctKo) btn.classList.add('correct');
                }
            }
            setTimeout(() => { currentIndex++; updateQuiz(); }, 1200);
        }

        /* ================= 결과 화면 ================= */
        function showResultScreen(title, desc, scoreText) {
            document.getElementById('result-title').innerText = title;
            document.getElementById('result-desc').innerText = desc;
            document.getElementById('result-score').innerText = scoreText;
            showScreen('result-message');
        }

        /* ================= 음성 재생 ================= */
        function playAudio(event) {
            if(event) event.stopPropagation();
            const text = targetWords[currentIndex].en;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US'; utterance.rate = 0.9;

            if (availableVoices.length > 0) {
                const bestVoice = availableVoices.find(v => v.name.includes('Google US English')) || 
                                  availableVoices.find(v => v.name.includes('Samantha')) || 
                                  availableVoices.find(v => v.lang === 'en-US');
                if (bestVoice) utterance.voice = bestVoice;
            }
            window.speechSynthesis.speak(utterance);
        }
    </script>
